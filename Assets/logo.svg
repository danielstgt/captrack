<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E323A"/>
      <stop offset="1" stop-color="#15171B"/>
    </linearGradient>
    <linearGradient id="weekly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FE3D1"/>
      <stop offset="1" stop-color="#3FB4EA"/>
    </linearGradient>
    <linearGradient id="fiveHour" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C96E"/>
      <stop offset="1" stop-color="#EF8F58"/>
    </linearGradient>
  </defs>

  <!-- macOS icon canvas: 824 pt rounded square centred on a 1024 pt grid -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>

  <!-- tracks -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="#3B4048" stroke-width="56"/>
  <circle cx="512" cy="512" r="180" fill="none" stroke="#3B4048" stroke-width="48"/>

  <!-- weekly window: outer arc -->
  <path d="M 726.5 332 A 280 280 0 1 0 726.5 692"
        fill="none" stroke="url(#weekly)" stroke-width="56" stroke-linecap="round"/>

  <!-- 5-hour window: inner arc -->
  <path d="M 649.9 396.3 A 180 180 0 0 0 342.9 573.6"
        fill="none" stroke="url(#fiveHour)" stroke-width="48" stroke-linecap="round"/>
</svg>
